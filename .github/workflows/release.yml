name: Release

on:
  push:
    tags:
      - 'badgevms-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: idf.py build

      - name: Merge P4 binaries
        run: |
          python -m esptool --chip esp32p4 merge_bin \
            --output esp32p4.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x2000   build/bootloader/bootloader.bin \
            0x8000   build/partition_table/partition-table.bin \
            0xd000   build/ota_data_initial.bin \
            0x10000  build/badgevms.bin \
            0x410000 build/storage.bin

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Flash instructions

            Download `esp32p4.bin` below and flash it via the badge's USB-C port:

            ```
            pip install esptool
            esptool write_flash 0x0 esp32p4.bin
            ```

            The Wi-Fi coprocessor (ESP32-C6) is flashed automatically by the
            badge on first boot — no second command needed.
          files: |
            esp32p4.bin
